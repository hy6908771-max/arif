<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Admin - Pink Glass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.cdnfonts.com/css/solaimanlipi');
        body {
            font-family: 'SolaimanLipi', sans-serif;
            background: linear-gradient(rgba(255, 192, 203, 0.4), rgba(255, 182, 193, 0.4)), url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            color: #1f2937;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.2);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ffb6c1;
            color: #000;
            border-radius: 12px;
            padding: 10px 15px;
            width: 100%;
            font-weight: 600;
            outline: none;
        }
        .glass-input:focus { border-color: #ff69b4; }
        .tab-btn { padding: 10px 24px; border-radius: 20px; transition: 0.3s; font-weight: 800; color: #4b5563; }
        .tab-active { background: #ff69b4; color: #fff; box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .info-item { background: rgba(255, 255, 255, 0.5); padding: 8px; border-radius: 12px; border: 1px solid #ffb6c1; text-align: center; }
        .info-label { color: #db2777; font-size: 9px; font-weight: 900; text-transform: uppercase; border-bottom: 1px solid #ffb6c1; display: block; margin-bottom: 2px; }
        .info-value { color: #000; font-size: 11px; font-weight: 800; display: block; word-break: break-all; }
        
        .section-header { grid-column: span 2; background: #ff69b4; color: white; font-size: 11px; font-weight: 900; padding: 6px; border-radius: 8px; margin-top: 15px; text-align: center; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; }
        .active-glow { background: #10b981; box-shadow: 0 0 10px #10b981; }
        .inactive-glow { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body class="p-4">

<div class="max-w-6xl mx-auto">
    <div class="flex flex-col items-center mb-8 gap-6">
        <h1 class="text-3xl md:text-5xl font-black text-white drop-shadow-md text-center bg-pink-500/50 px-6 py-2 rounded-2xl">ELITE CONTROL CENTER</h1>
        <div class="flex glass-card p-1.5 rounded-full overflow-x-auto">
            <button onclick="showTab('admins')" id="btn-admins" class="tab-btn tab-active whitespace-nowrap">অ্যাডমিন প্যানেল</button>
            <button onclick="showTab('users')" id="btn-users" class="tab-btn whitespace-nowrap">ইউজার লিস্ট</button>
            <button onclick="showTab('global')" id="btn-global" class="tab-btn whitespace-nowrap">সেটিংস</button>
        </div>
    </div>

    <div id="tab-admins" class="space-y-6">
        <div class="flex justify-center">
            <button onclick="addAdminNode()" class="bg-white text-pink-600 border-2 border-pink-500 px-6 py-2 rounded-full font-black hover:bg-pink-500 hover:text-white transition shadow-lg">
                <i class="fas fa-plus-circle mr-2"></i> নতুন এডমিন যোগ করুন
            </button>
        </div>
        <div id="adminList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="tab-users" class="hidden glass-card max-w-2xl mx-auto overflow-hidden animate__animated animate__fadeIn">
        <div class="p-6 border-b border-pink-200 flex justify-between items-center bg-white/40">
            <h3 class="text-xl font-black text-pink-600">মেম্বার ডাটাবেস</h3>
            <span id="userTotal" class="bg-pink-600 text-white px-4 py-1 rounded-full text-xs font-black shadow-inner">Total: 0</span>
        </div>
        <div id="userContainer" class="divide-y divide-pink-100 max-h-[500px] overflow-y-auto p-4 space-y-3"></div>
    </div>

    <div id="tab-global" class="hidden max-w-xl mx-auto space-y-6 animate__animated animate__fadeIn">
        <div class="glass-card p-8 space-y-6 border-pink-300">
            <div class="space-y-2">
                <label class="font-black text-xs uppercase text-pink-700 ml-2">হোম স্ক্রিন নোটিশ</label>
                <textarea id="notice1" class="glass-input h-24" placeholder="এখানে প্রধান নোটিশ লিখুন..."></textarea>
                <button onclick="saveSingle('notice1')" class="w-full bg-pink-500 text-white font-black py-3 rounded-xl hover:bg-pink-600 transition shadow-md">UPDATE NOTICE 1</button>
            </div>
            <div class="space-y-2">
                <label class="font-black text-xs uppercase text-pink-700 ml-2">নির্দেশনা নোটিশ</label>
                <textarea id="notice2" class="glass-input h-24" placeholder="এখানে নির্দেশনা লিখুন..."></textarea>
                <button onclick="saveSingle('notice2')" class="w-full bg-pink-500 text-white font-black py-3 rounded-xl hover:bg-pink-600 transition shadow-md">UPDATE NOTICE 2</button>
            </div>
            <div class="p-5 bg-white/50 rounded-3xl space-y-4 border border-pink-200">
                <label class="font-black text-sm uppercase text-pink-900 block text-center underline">সোশ্যাল মিডিয়া লিঙ্ক</label>
                <div>
                    <label class="text-[10px] font-black uppercase ml-1">WhatsApp Community Link</label>
                    <input id="wa_link" type="text" class="glass-input text-xs" placeholder="লিঙ্ক দিন...">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase ml-1">YouTube Channel Link</label>
                    <input id="yt_link" type="text" class="glass-input text-xs" placeholder="লিঙ্ক দিন...">
                </div>
                <button onclick="saveLinks()" class="w-full bg-pink-700 text-white font-black py-3 rounded-xl shadow-lg transition active:scale-95">SAVE LINKS</button>
            </div>
        </div>
    </div>
</div>

<div id="userModal" class="fixed inset-0 bg-pink-900/40 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-2xl p-6 relative animate__animated animate__zoomIn border-white">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-pink-400 hover:text-pink-700 transition"><i class="fas fa-times-circle text-2xl"></i></button>
        <div class="text-center mb-4">
            <h2 id="mName" class="text-xl font-black text-pink-700">ইউজার নাম</h2>
            <p id="mTime" class="text-[9px] text-slate-500 font-bold"></p>
        </div>
        <div id="mInfo" class="info-grid overflow-y-auto max-h-[550px] pr-2 mb-4">
            </div>
        <div class="grid grid-cols-2 gap-3 mt-4">
            <button id="delBtn" class="bg-red-500 text-white py-3 rounded-xl font-black text-xs shadow-md col-span-2">DELETE APPLICATION</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBt97JifGje7Gr9GHdh98JssqSbn1zVAGE",
        authDomain: "ashraf-13855.firebaseapp.com",
        databaseURL: "https://ashraf-13855-default-rtdb.firebaseio.com",
        projectId: "ashraf-13855",
        storageBucket: "ashraf-13855.firebasestorage.app",
        messagingSenderId: "891482550537",
        appId: "1:891482550537:android:1fef6aeb15e1c2c4e163d8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let selectedUserId = null;

    // Admin Panel Logic
    window.addAdminNode = () => {
        push(ref(db, 'admin_settings'), {
            name: "নতুন এডমিন", status: "inactive",
            img: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png",
            wa: "", bkash: "", nagad: "", rocket: "", upay: ""
        });
    };

    onValue(ref(db, 'admin_settings'), (snap) => {
        const admins = snap.val();
        const container = document.getElementById('adminList');
        container.innerHTML = ""; if(!admins) return;
        Object.keys(admins).forEach(key => {
            const ad = admins[key];
            const activeClass = ad.status === 'active' ? 'active-glow' : 'inactive-glow';
            container.innerHTML += `
            <div class="glass-card p-5 border-pink-100">
                <div class="flex justify-between items-start mb-4">
                     <button onclick="deleteAdmin('${key}')" class="text-red-400"><i class="fas fa-trash-alt"></i></button>
                     <div class="relative">
                        <img id="img_${key}" src="${ad.img || 'https://via.placeholder.com/150'}" class="w-20 h-20 rounded-full border-4 border-white object-cover">
                        <span class="status-dot absolute bottom-1 right-1 ${activeClass}"></span>
                     </div>
                     <button onclick="promptPhoto('${key}','admin','img_${key}')" class="text-blue-400"><i class="fas fa-camera"></i></button>
                </div>
                <div class="space-y-3">
                    <input id="name_${key}" type="text" value="${ad.name || ''}" class="glass-input text-center text-sm" placeholder="নাম">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="status_${key}" class="glass-input text-[10px]">
                            <option value="inactive" ${ad.status === 'inactive' ? 'selected' : ''}>অফলাইন</option>
                            <option value="active" ${ad.status === 'active' ? 'selected' : ''}>অনলাইন</option>
                        </select>
                        <input id="wa_${key}" type="text" value="${ad.wa || ''}" placeholder="WhatsApp No" class="glass-input text-[10px]">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="bkash_${key}" value="${ad.bkash || ''}" class="glass-input text-[10px]" placeholder="বিকাশ">
                        <input id="nagad_${key}" value="${ad.nagad || ''}" class="glass-input text-[10px]" placeholder="নগদ">
                        <input id="rocket_${key}" value="${ad.rocket || ''}" class="glass-input text-[10px]" placeholder="রকেট">
                        <input id="upay_${key}" value="${ad.upay || ''}" class="glass-input text-[10px]" placeholder="উপায়">
                    </div>
                </div>
                <button onclick="updateAdminNode('${key}')" class="w-full mt-4 bg-pink-600 text-white py-2 rounded-xl font-black text-xs">Update Admin</button>
            </div>`;
        });
    });

    window.updateAdminNode = (key) => {
        update(ref(db, 'admin_settings/' + key), {
            name: document.getElementById(`name_${key}`).value,
            status: document.getElementById(`status_${key}`).value,
            wa: document.getElementById(`wa_${key}`).value,
            bkash: document.getElementById(`bkash_${key}`).value,
            nagad: document.getElementById(`nagad_${key}`).value,
            rocket: document.getElementById(`rocket_${key}`).value,
            upay: document.getElementById(`upay_${key}`).value
        }).then(() => alert("আপডেট সফল!"));
    };

    window.deleteAdmin = (key) => { if(confirm("ডিলিট করতে চান?")) remove(ref(db, 'admin_settings/' + key)); };

    // User List Logic
    onValue(ref(db, 'verifications'), (snap) => {
        const users = snap.val();
        const container = document.getElementById('userContainer');
        container.innerHTML = ""; if(!users) return;
        let count = 0;
        Object.keys(users).forEach(id => {
            count++; const u = users[id];
            container.innerHTML += `
            <div class="glass-card p-3 flex items-center gap-4 cursor-pointer hover:bg-white/80 transition" onclick="openUser('${id}')">
                <div class="flex-1">
                    <h4 class="font-black text-pink-800 text-sm">${u.own?.name || 'Unknown'}</h4>
                    <p class="text-[9px] text-pink-500 font-bold uppercase">TRX: ${u.payment?.trx || 'N/A'}</p>
                </div>
                <div class="text-right">
                    <p class="text-[8px] font-bold text-slate-400">${u.time || ''}</p>
                    <i class="fas fa-chevron-right text-pink-200"></i>
                </div>
            </div>`;
        });
        document.getElementById('userTotal').innerText = "Total: " + count;
        window.allUsers = users;
    });

    // OPEN USER MODAL - All Fields Added Here
    window.openUser = (id) => {
        selectedUserId = id;
        const u = window.allUsers[id];
        document.getElementById('mName').innerText = u.own?.name || "N/A";
        document.getElementById('mTime').innerText = "আবেদনের সময়: " + (u.time || 'N/A');
        
        let html = `
            <div class="section-header">১. আবেদনকারীর নিজের তথ্য</div>
            ${renderField('নাম', u.own?.name)} 
            ${renderField('পিতার নাম', u.own?.fname)}
            ${renderField('মাতার নাম', u.own?.mname)} 
            ${renderField('জন্ম তারিখ', u.own?.dob)}
            ${renderField('NID নম্বর', u.own?.nid)}
            ${renderField('গ্রাম', u.own?.vill)} 
            ${renderField('ইউনিয়ন', u.own?.union)}
            ${renderField('ওয়ার্ড নং', u.own?.word)}
            ${renderField('থানা', u.own?.thana)} 
            ${renderField('জেলা', u.own?.dist)}
            ${renderField('বিভাগ', u.own?.div)} 
            ${renderField('দেশ', u.own?.country)}

            <div class="section-header">২. পিতার তথ্য (বিস্তারিত)</div>
            ${renderField('নাম', u.father?.name)} 
            ${renderField('পিতার নাম', u.father?.fname)}
            ${renderField('মাতার নাম', u.father?.mname)} 
            ${renderField('জন্ম তারিখ', u.father?.dob)}
            ${renderField('NID নম্বর', u.father?.nid)}
            ${renderField('গ্রাম', u.father?.vill)} 
            ${renderField('ইউনিয়ন', u.father?.union)}
            ${renderField('ওয়ার্ড নং', u.father?.word)}
            ${renderField('থানা', u.father?.thana)} 
            ${renderField('জেলা', u.father?.dist)}
            ${renderField('বিভাগ', u.father?.div)} 
            ${renderField('দেশ', u.father?.country)}

            <div class="section-header">৩. মাতার তথ্য (বিস্তারিত)</div>
            ${renderField('নাম', u.mother?.name)} 
            ${renderField('পিতার নাম', u.mother?.fname)}
            ${renderField('মাতার নাম', u.mother?.mname)} 
            ${renderField('জন্ম তারিখ', u.mother?.dob)}
            ${renderField('NID নম্বর', u.mother?.nid)}
            ${renderField('গ্রাম', u.mother?.vill)} 
            ${renderField('ইউনিয়ন', u.mother?.union)}
            ${renderField('ওয়ার্ড নং', u.mother?.word)}
            ${renderField('থানা', u.mother?.thana)} 
            ${renderField('জেলা', u.mother?.dist)}
            ${renderField('বিভাগ', u.mother?.div)} 
            ${renderField('দেশ', u.mother?.country)}

            <div class="section-header">৪. ফ্যামিলি মেম্বার ও কন্টাক্ট</div>
            <div class="col-span-2 bg-white/40 p-3 rounded-xl text-[11px] font-bold text-pink-700 leading-relaxed">
                ${u.family ? u.family.replace(/\n/g, '<br>') : 'তথ্য নেই'}
            </div>

            <div class="section-header">৫. বর্তমান ঠিকানা</div>
            <div class="col-span-2 bg-white/40 p-3 rounded-xl text-[11px] font-bold text-slate-700 text-center">
                ${u.present_address || (u.own?.vill + ', ' + u.own?.thana + ', ' + u.own?.dist)}
            </div>

            <div class="section-header">৬. ব্যাংকিং সার্ভিস ও নম্বর</div>
            <div class="col-span-2 bg-white/40 p-3 rounded-xl text-[11px] font-bold text-pink-700 leading-relaxed">
                ${u.banking ? u.banking.replace(/\n/g, '<br>') : 'তথ্য নেই'}
            </div>

            <div class="section-header">৭. অনলাইন প্ল্যাটফর্ম লিংক</div>
            <div class="col-span-2 bg-white/40 p-3 rounded-xl text-[10px] font-bold text-blue-600 leading-relaxed break-all">
                ${u.online ? u.online.replace(/\n/g, '<br>') : 'তথ্য নেই'}
            </div>

            <div class="section-header bg-pink-700 text-white">৮. পেমেন্ট ও এডমিন তথ্য</div>
            ${renderField('নির্বাচিত এডমিন', u.admin)}
            ${renderField('পেমেন্ট মাধ্যম', u.payment?.method)}
            ${renderField('প্রেরক নম্বর', u.payment?.sender)}
            ${renderField('টাকার পরিমাণ', u.payment?.amount + ' TK')}
            <div class="info-item col-span-2"><span class="info-label">Transaction ID</span><span class="info-value text-red-600 font-mono font-black">${u.payment?.trx || 'N/A'}</span></div>
        `;

        document.getElementById('mInfo').innerHTML = html;
        document.getElementById('userModal').classList.remove('hidden');
    }

    function renderField(label, value) {
        return `<div class="info-item"><span class="info-label">${label}</span><span class="info-value">${value || 'তথ্য নেই'}</span></div>`;
    }

    window.closeModal = () => document.getElementById('userModal').classList.add('hidden');
    document.getElementById('delBtn').onclick = () => {
        if(confirm("আবেদনটি ডিলিট করতে চান?")) remove(ref(db, 'verifications/' + selectedUserId)).then(() => closeModal());
    };

    // Settings logic
    window.saveSingle = (id) => {
        const obj = {}; obj[id] = document.getElementById(id).value;
        update(ref(db, 'global_settings'), obj).then(() => alert("সেভ হয়েছে!"));
    };
    window.saveLinks = () => {
        update(ref(db, 'global_settings'), {
            wa_public: document.getElementById('wa_link').value,
            yt_channel: document.getElementById('yt_link').value
        }).then(() => alert("লিঙ্ক আপডেট হয়েছে!"));
    };

    onValue(ref(db, 'global_settings'), (snap) => {
        const d = snap.val() || {};
        document.getElementById('notice1').value = d.notice1 || "";
        document.getElementById('notice2').value = d.notice2 || "";
        document.getElementById('wa_link').value = d.wa_public || "";
        document.getElementById('yt_link').value = d.yt_channel || "";
    });

    window.promptPhoto = (key, type, imgId) => {
        let n = prompt("ছবির ডাইরেক্ট লিঙ্ক দিন:");
        if(n) {
            update(ref(db, `admin_settings/${key}`), { img: n });
            document.getElementById(imgId).src = n;
        }
    };
</script>

<script>
    function showTab(id) {
        ['admins', 'users', 'global'].forEach(t => {
            document.getElementById('tab-' + t).classList.add('hidden');
            document.getElementById('btn-' + t).classList.remove('tab-active');
        });
        document.getElementById('tab-' + id).classList.remove('hidden');
        document.getElementById('btn-' + id).classList.add('tab-active');
    }
</script>
</body>
</html>
